name: Rust CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    if: |
      !contains(github.event.head_commit.message, '[ci-skip]') &&
      !contains(github.event.pull_request.title, '[ci-skip]')
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1

      - id: setup_rust
        name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: stable
          components: rustfmt, clippy

      - id: run_sccache_cache
        name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - id: cache_dependencies
        name: Cache dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - id: run_lint
        name: Run Lint
        run: |
          cargo clippy --all-targets --all-features -- -W clippy::pedantic -D warnings
          cargo fmt --all -- --check
        shell: bash

  test:
    name: Test
    if: |
      !contains(github.event.head_commit.message, '[ci-skip]') &&
      !contains(github.event.pull_request.title, '[ci-skip]')
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1

      - id: setup_rust
        name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: stable

      - id: run_sccache_cache
        name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - id: cache_dependencies
        name: Cache dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - id: run_tests
        name: Run Tests
        run: cargo test
        shell: bash

  build:
    name: Build
    if: |
      !contains(github.event.head_commit.message, '[ci-skip]') &&
      !contains(github.event.pull_request.title, '[ci-skip]')
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7.0.1

      - id: setup_rust
        name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: stable

      - id: run_sccache_cache
        name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - id: cache_dependencies
        name: Cache dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - id: build_release
        name: Build Release
        run: cargo build --release
        shell: bash

