[package]
name = "zed-minimessage-ext"
version = "0.1.0"
edition = "2024"
description = "MiniMessage validation and hover preview for Zed"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
